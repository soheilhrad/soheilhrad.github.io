  feeling:
    label: "یک احساس بنویسید و آن را بشنوید."
    pad: "نقشه را لمس کنید"
    why: "چطور ساخته شده"
    placeholder: "مثلاً کمی دلتنگ"
    submit: "بشنو"
    examples: "امتحان کنید"
    chips: ["دلتنگی", "alegría", "homesick"]
    play: "پخش"
    stop: "توقف"
    map: "یا روی نقشه بگردید"
    map_hint: "هر نقطه قطعهٔ متفاوتی می‌نوازد: چپ تیره‌تر، راست روشن‌تر، پایین آرام‌تر و بالا پرشورتر."
    axis_dark: "تیره‌تر"
    axis_bright: "روشن‌تر"
    axis_calm: "آرام‌تر"
    axis_intense: "پرشورتر"
    intense: "شدید"
    gentle: "ملایم"
    not: "نه"
    share: "کپی پیوند"
    copied: "کپی شد"
    unknown: "این احساس را هنوز نمی‌شناسم. کلمهٔ دیگری امتحان کنید: دلتنگی، آرامش، ترس."
    note: "واژه‌های آشنا روی دستگاه شما شناسایی می‌شوند. واژه‌های دیگر برای دسته‌بندی به یک مدل هوش مصنوعی در Cloudflare می‌روند؛ این سایت چیزی ذخیره نمی‌کند."
    research: "پژوهشی که پشت آن است"
    research_intro: "جای هر احساس روی نقشه از مدل دایره‌ای راسل (ظرفیت و برانگیختگی، ۱۹۸۰) پیروی می‌کند. خود احساس‌ها از مقیاس هیجان‌های موسیقایی ژنو (زنتنر و همکاران، ۲۰۰۸) و خوشه‌های صفت هونر (۱۹۳۶) گرفته شده‌اند. نشانه‌های موسیقایی (گام، ضرب، بم و زیری، روشنی و شیوهٔ اجرای نت‌ها) از مرورهای یوسلین و لائوکا (۲۰۰۳) و گابریلسون و لیندستروم (۲۰۱۰) می‌آیند."
    research_caveat: "این یک طراحی بر پایهٔ یافته‌های منتشرشده است، نه یک ابزار آزموده‌شده. تنظیم هر احساس برداشت خودمان از آن یافته‌هاست و بیشتر پژوهش‌ها با شنوندگان غربی و موسیقی تونال غربی انجام شده‌اند. فهرست واژه‌های اسپانیایی و فارسی را خودمان گردآورده‌ایم و اعتبارسنجی نشده‌اند. هنوز با شنوندگان آزمایش نکرده‌ایم."
    references: "منابع"
    sound: "صدا"
    timbre_auto: "خودکار"
    timbre_keys: "کلید"
    timbre_strings: "زهی"
    take: "یک نسخهٔ دیگر"
    emotions:
      joy:
        name: "شادی"
        cue: "گام ماژور، ضرب تند، نت‌های روشن و کوتاه. شنونده‌ها معمولاً این نشانه‌ها را شادی می‌شنوند."
      sadness:
        name: "اندوه"
        cue: "گام مینور، ضرب کند، صدای بم، خط ملودی رو به پایین. نشانه‌هایی که بیشتر اندوه شنیده می‌شوند."
      calm:
        name: "آرامش"
        cue: "نت‌های کم، نرم و کند، با فاصله‌های بلند. تغییر اندک، آرامش می‌سازد."
      fear:
        name: "ترس"
        cue: "گام‌های ناهماهنگ، ریتم نامنظم، بلندشدن آهستهٔ صدا. نشانه‌های دلهره."
      anger:
        name: "خشم"
        cue: "تند، بلند، با صدایی خشن: نت‌های کوتاه و تکراری در ناحیهٔ بم."
      tenderness:
        name: "مهربانی"
        cue: "نرم، کند و گرد، با خطی که آرام تاب می‌خورد. گرما از نرمی می‌آید، نه از سرعت."
      longing:
        name: "دلتنگی"
        cue: "رنگ مینور با درجهٔ ششم بالارفته، قوسی کند و پایانی که حل نمی‌شود."
      wonder:
        name: "شگفتی"
        cue: "رنگ لیدین، جهش‌های رو به بالا، صدای زیر و کمی پژواک."
      hope:
        name: "امید"
        cue: "خطی ماژور که پیوسته بالا می‌رود و فقط در پایان فرود می‌آید."
      nostalgia:
        name: "نوستالژی"
        cue: "کند و گرم: قوسی ملایم از نت‌ها با پژواکی نرم، مثل ملودی‌ای که به یاد می‌آوریم. شیرینی همراه با ردپایی از فقدان."
      power:
        name: "قدرت"
        cue: "قوی، استوار و بلند، در ناحیهٔ بم، با خطی صعودی که محکم فرود می‌آید. نشانه‌های توان و پیروزی."
      tension:
        name: "تنش"
        cue: "تند، نامنظم و حل‌نشده: خطی بی‌قرار که فشار می‌آورد و هرگز آرام نمی‌گیرد."
      transcendence:
        name: "تعالی"
        cue: "بسیار کند و گسترده: نت‌های کشیده، صدای زیر، یک زمینهٔ پیوسته و پژواکی بزرگ. حس فضا."
      playfulness:
        name: "بازیگوشی"
        cue: "نت‌های سبک، تند و جدا از هم که می‌جهند و می‌پرند، در گام ماژور. سبکی با جَست‌وخیز."
    modes:
      major: "ماژور"
      minor: "مینور"
      dorian: "دورین"
      lydian: "لیدین"
      phrygian: "فریژین"
      locrian: "لوکرین"
      pentaMaj: "پنتاتونیک ماژور"
