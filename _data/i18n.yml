    chips: ["añoranza", "homesick", "دلتنگی"]
    play: "Reproducir"
    stop: "Detener"
    estimated: "posición estimada"
    map: "O explora el mapa"
    map_hint: "Cada punto suena distinto: más oscuro a la izquierda, más luminoso a la derecha, más sereno abajo y más intenso arriba."
    axis_dark: "más oscuro"
    axis_bright: "más luminoso"
    axis_calm: "más sereno"
    axis_intense: "más intenso"
    intense: "fuerte"
    gentle: "leve"
    not: "No"
    share: "Copiar enlace"
    copied: "Copiado"
    unknown: "Todavía no conozco ese sentimiento. Prueba con otra palabra: añoranza, calma, miedo."
    note: "Las palabras conocidas se reconocen en tu dispositivo. Las demás se envían a un modelo de IA de Cloudflare para clasificarlas; este sitio no guarda nada."
    research: "La investigación detrás"
    research_intro: "El mapa es el modelo circumplejo de Russell (valencia y activación, 1980), y cada sentimiento está donde hablantes de inglés puntuaron su palabra en las normas de Warriner, Kuperman y Brysbaert (2013). Los sentimientos se apoyan en la Escala Ginebrina de Emociones Musicales (Zentner y colaboradores, 2008) y en los grupos de adjetivos de Hevner (1936). Las señales musicales (modo, tempo, registro, brillo, articulación) siguen las revisiones de Juslin y Laukka (2003) y de Gabrielsson y Lindström (2010); cómo cambia cada señal a lo largo del mapa sigue a Eerola, Friberg y Bresin (2013)."
    research_caveat: "Es un diseño construido a partir de hallazgos publicados, no un instrumento validado. Los ajustes de cada sentimiento son nuestra lectura de esos hallazgos, y la mayoría de los estudios usaron oyentes occidentales y música tonal occidental. Las listas de palabras en español y persa las hemos compilado nosotros y no están validadas. No hemos probado el sonido generado con oyentes."
    references: "Referencias"
    free_rhythm: "ritmo libre"
    then: "luego"
    research_study: "Un estudio de escucha de música clásica persa comprueba las etiquetas de alegre y triste con grabaciones reales. No pone a prueba el sonido generado de esta página."
    research_more: "Leer sobre el estudio"
    emotions:
      joy:
        name: "Alegría"
        cue: "Modo mayor, tempo rápido, notas brillantes y picadas. Suelen oírse como alegría."
      sadness:
        name: "Tristeza"
        cue: "Modo menor, tempo lento, registro grave, línea descendente. Las señales que más se oyen como tristeza."
      calm:
        name: "Calma"
        cue: "Pocas notas, suaves y lentas, con silencios amplios. Poco cambio suena a calma."
      fear:
        name: "Miedo"
        cue: "Intervalos disonantes, ritmo irregular, un crescendo lento. Las señales de la inquietud."
      anger:
        name: "Ira"
        cue: "Rápido, fuerte, de timbre áspero: notas cortas repetidas en registro grave."
      tenderness:
        name: "Ternura"
        cue: "Suave, lento y redondeado, con una línea que se mece. La calidez viene de la suavidad, no de la velocidad."
      longing:
        name: "Añoranza"
        cue: "Color menor con sexta elevada, un arco lento y un final que no resuelve."
      wonder:
        name: "Asombro"
        cue: "Color lidio, saltos ascendentes, registro agudo y un destello de eco."
      hope:
        name: "Esperanza"
        cue: "Una línea mayor que sigue subiendo y solo aterriza al final."
      nostalgia:
        name: "Nostalgia"
        cue: "Lento y cálido: un arco suave de notas con un eco tenue, como una melodía recordada. Dulzura con un rastro de pérdida."
      power:
        name: "Poder"
        cue: "Fuerte, firme y sonoro, en registro grave, con una línea ascendente que aterriza con seguridad. Las señales de la fuerza y el triunfo."
      tension:
        name: "Tensión"
        cue: "Rápida, irregular y sin resolver: una línea inquieta que presiona y nunca se asienta."
      transcendence:
        name: "Trascendencia"
        cue: "Muy lento y amplio: notas largas, registro agudo, un bordón constante y mucho eco. Una sensación de espacio."
      playfulness:
        name: "Juego"
        cue: "Notas ligeras, rápidas y picadas que saltan y brincan, en modo mayor. Ligereza con rebote."
      bittersweet:
        name: "Agridulce"
        cue: "Un color mayor que se vuelve menor, o al revés, en una línea sin compás fijo. Alegre y triste a la vez."
      moved:
        name: "Conmovido"
        cue: "Lento, sin compás fijo y en crescendo: notas largas que suben de volumen y se apagan, en color menor y con un eco largo. En nuestro estudio, cuanto más triste sonaba una pieza, más conmovía a los oyentes."
    modes:
      major: "mayor"
      minor: "menor"
      dorian: "dórico"
      lydian: "lidio"
      phrygian: "frigio"
      locrian: "locrio"
      pentaMaj: "pentatónica mayor"
  placement:
    title: "Dónde está cada sentimiento"
    intro: "Cada sentimiento está donde la gente puntuó su palabra. En las normas de Warriner, Kuperman y Brysbaert (2013), unos 20 hablantes de inglés puntuaron cada palabra de 1 a 9 en valencia (de desagradable a agradable) y en activación (de sereno a excitado). El mapa muestra (puntuación − 5) ÷ 4, así que no se estira nada. Las puntuaciones de las palabras se agrupan hacia el centro: incluso la ira se puntúa como moderadamente activadora, por lo que ningún sentimiento llega a la parte alta del mapa."
    cols: ["Sentimiento", "Palabra puntuada", "Valencia", "Activación", "Russell (1980): ángulo y, después, normas"]
    basis: {published: "", related: "una palabra relacionada", estimated: "estimado: media de estas palabras"}
    russell_note: "Russell (1980) imprimió el ángulo en su círculo para 15 de sus 28 palabras. Cuando una de ellas es la palabra de un sentimiento de aquí, la tabla da su ángulo y el que las normas dan a la misma palabra (0° es agradable, 90° es activado). «happy», «sad» y «calm» apuntan en la misma dirección; «tense» no: Russell la sitúa cerca de lo alto de su círculo, mientras que quienes puntuaron la vieron desagradable pero solo moderadamente activadora."
    hollow: "Los puntos huecos del mapa son estimados."
  months: [enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
  months_short: [ene, feb, mar, abr, may, jun, jul, ago, sept, oct, nov, dic]
