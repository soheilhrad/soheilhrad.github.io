  placement:
    title: "جای هر احساس"
    intro: "هر احساس همان‌جایی است که مردم واژه‌اش را نمره داده‌اند. در هنجارهای وارینر، کوپرمن و بریسبرت (۲۰۱۳)، حدود ۲۰ انگلیسی‌زبان هر واژه را از ۱ تا ۹ برای ظرفیت (از ناخوشایند تا خوشایند) و برانگیختگی (از آرام تا هیجان‌زده) نمره دادند. نقشه (نمره − ۵) ÷ ۴ را نشان می‌دهد، پس چیزی کشیده نشده است. نمرهٔ واژه‌ها به میانه می‌چسبد: حتی خشم هم فقط نسبتاً برانگیزاننده نمره گرفته است، برای همین هیچ احساسی به بالای نقشه نمی‌رسد."
    cols: ["احساس", "واژهٔ نمره‌داده‌شده", "ظرفیت", "برانگیختگی", "راسل (۱۹۸۰): زاویه، سپس هنجارها"]
    basis: {published: "", related: "یک واژهٔ هم‌خانواده", estimated: "تخمینی: میانگین این واژه‌ها"}
    russell_note: "راسل (۱۹۸۰) زاویهٔ ۱۵ واژه از ۲۸ واژهٔ خود را روی دایره‌اش چاپ کرده است. وقتی یکی از آن‌ها واژهٔ یکی از احساس‌های اینجا باشد، جدول زاویهٔ او و زاویه‌ای را که هنجارها به همان واژه می‌دهند نشان می‌دهد (۰° خوشایند، ۹۰° برانگیخته). «happy»، «sad» و «calm» به یک سو اشاره می‌کنند؛ «tense» نه: راسل آن را نزدیک بالای دایره‌اش می‌گذارد، اما نمره‌دهندگان آن را ناخوشایند و فقط نسبتاً برانگیزاننده دانستند."
    hollow: "نقطه‌های توخالی روی نقشه تخمینی‌اند."
