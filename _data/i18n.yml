    share: "Copy link"
    copied: "Copied"
    unknown: "I don't know that feeling yet. Try another word: longing, calm, fear."
    note: "Known words are matched on your device. Other words go to an AI model at Cloudflare to be classified; this site stores nothing."
    research: "The research behind it"
    research_intro: "The map is Russell's circumplex model (valence and arousal, 1980), and each feeling sits where English speakers rated its word in the norms of Warriner, Kuperman and Brysbaert (2013). The feelings themselves draw on the Geneva Emotional Music Scale (Zentner and colleagues, 2008) and Hevner's adjective clusters (1936). The musical cues (mode, tempo, register, brightness, articulation) follow the reviews by Juslin and Laukka (2003) and Gabrielsson and Lindström (2010); how each cue changes across the map follows Eerola, Friberg and Bresin (2013)."
    research_caveat: "This is a design built from published findings, not a tested instrument. The settings for each feeling are our reading of those findings, and most of the studies used Western listeners and Western tonal music. We compiled the Spanish and Persian word lists ourselves, and they are not validated. We have not tested the generated sound with listeners."
    references: "References"
    free_rhythm: "free rhythm"
    then: "then"
    research_study: "A listening study of Persian classical music checks the happy and sad labels on real recordings. It does not test this page's generated sound."
    research_more: "Read about the study"
    emotions:
      joy:
        name: "Joy"
        cue: "Major mode, quick tempo, bright and detached notes. Listeners tend to hear these cues as joy."
      sadness:
        name: "Sadness"
        cue: "Minor mode, slow tempo, low register, a falling line. The cues most often heard as sadness."
      calm:
        name: "Calm"
        cue: "Few notes, soft and slow, with wide gaps between them. Little change is what reads as calm."
      fear:
        name: "Fear"
        cue: "Dissonant steps, uneven rhythm, a slow swell in volume. The cues of unease."
      anger:
        name: "Anger"
        cue: "Fast, loud, harsh in timbre: short repeated notes in a low register."
      tenderness:
        name: "Tenderness"
        cue: "Soft, slow and rounded, with a gently rocking line. Warmth comes from gentleness, not speed."
      longing:
        name: "Longing"
        cue: "Minor colour with a lifted sixth, a slow arch, and an ending that never resolves."
      wonder:
        name: "Wonder"
        cue: "Lydian colour, rising leaps, a high register and a shimmer of echo."
      hope:
        name: "Hope"
        cue: "A major line that keeps climbing, and lands only at the very end."
      nostalgia:
        name: "Nostalgia"
        cue: "Slow and warm: a gentle arch of notes with a soft echo, like a tune remembered. Sweetness with a trace of loss."
      power:
        name: "Power"
        cue: "Strong, steady and loud, low in register, with a rising line that lands firmly. The cues of strength and triumph."
      tension:
        name: "Tension"
        cue: "Fast, uneven and unresolved: a restless line that keeps pressing and never settles."
      transcendence:
        name: "Transcendence"
        cue: "Very slow and wide: long held tones, a high register, a steady drone and a large echo. A sense of space."
      playfulness:
        name: "Playfulness"
        cue: "Light, quick, detached notes that skip and leap, in a major key. Lightness with a bounce."
      bittersweet:
        name: "Bittersweet"
        cue: "A major colour that turns minor, or the reverse, in a line with no fixed beat. Happy and sad at once."
      moved:
        name: "Moved"
        cue: "Slow, with no fixed beat, and swelling: held notes that grow louder and fade, in a minor colour with a long echo. In our study, the sadder a piece sounded, the more it moved listeners."
    modes:
      major: "major"
      minor: "minor"
      dorian: "dorian"
      lydian: "lydian"
      phrygian: "phrygian"
      locrian: "locrian"
      pentaMaj: "major pentatonic"
  placement:
    title: "Where each feeling sits"
    intro: "Each feeling sits where people rated its word. In the norms of Warriner, Kuperman and Brysbaert (2013), about 20 English speakers rated each word from 1 to 9 for valence (unpleasant to pleasant) and for arousal (calm to excited). The map shows (rating − 5) ÷ 4, so nothing is stretched. Word ratings bunch towards the middle: even anger is rated only moderately arousing, so no feeling reaches the top of the map."
    cols: ["Feeling", "Word rated", "Valence", "Arousal", "Russell (1980): angle, then norms"]
    basis: {published: "", related: "a related word", estimated: "estimated: mean of these words"}
    russell_note: "Russell (1980) printed the angle on his circle for 15 of his 28 words. Where one of them is the word for a feeling here, the table gives his angle and the angle the norms give the same word (0° is pleasant, 90° is aroused). “happy”, “sad” and “calm” point the same way; “tense” does not: Russell puts it near the top of his circle, while raters called it unpleasant but only moderately arousing."
    hollow: "Hollow dots on the map are estimated."
  months: [January, February, March, April, May, June, July, August, September, October, November, December]
  months_short: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
