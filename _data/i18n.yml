  feeling:
    label: "Type a feeling. Hear it."
    pad: "Touch the map"
    why: "How it's made"
    placeholder: "e.g. a bit homesick"
    submit: "Hear it"
    examples: "Try"
    chips: ["homesick", "alegría", "دلتنگی"]
    play: "Play"
    stop: "Stop"
    map: "Or explore the map"
    map_hint: "Every spot plays a different piece: darker to the left, brighter to the right, calmer at the bottom, more intense at the top."
    axis_dark: "darker"
    axis_bright: "brighter"
    axis_calm: "calmer"
    axis_intense: "more intense"
    intense: "strong"
    gentle: "light"
    not: "Not"
    share: "Copy link"
    copied: "Copied"
    unknown: "I don't know that feeling yet. Try another word: longing, calm, fear."
    note: "Known words are matched on your device. Other words go to an AI model at Cloudflare to be classified; this site stores nothing."
    research: "The research behind it"
    research_intro: "Where a feeling sits on the map follows Russell's circumplex model (valence and arousal, 1980). The feelings themselves draw on the Geneva Emotional Music Scale (Zentner and colleagues, 2008) and Hevner's adjective clusters (1936). The musical cues (mode, tempo, register, brightness, articulation) follow the reviews by Juslin and Laukka (2003) and Gabrielsson and Lindström (2010)."
    research_caveat: "This is a design built from published findings, not a tested instrument. The settings for each feeling are our reading of those findings, and most of the studies used Western listeners and Western tonal music. We compiled the Spanish and Persian word lists ourselves, and they are not validated. We have not yet checked it with listeners."
    references: "References"
    sound: "Sound"
    timbre_auto: "Auto"
    timbre_keys: "Keys"
    timbre_strings: "Strings"
    take: "Another take"
    emotions:
      joy:
        name: "Joy"
        cue: "Major mode, quick tempo, bright and detached notes. Listeners tend to hear these cues as joy."
      sadness:
        name: "Sadness"
        cue: "Minor mode, slow tempo, low register, a falling line. The cues most often heard as sadness."
      calm:
        name: "Calm"
        cue: "Few notes, soft and slow, with wide gaps between them. Little change is what reads as calm."
      fear:
        name: "Fear"
        cue: "Dissonant steps, uneven rhythm, a slow swell in volume. The cues of unease."
      anger:
        name: "Anger"
        cue: "Fast, loud, harsh in timbre: short repeated notes in a low register."
      tenderness:
        name: "Tenderness"
        cue: "Soft, slow and rounded, with a gently rocking line. Warmth comes from gentleness, not speed."
      longing:
        name: "Longing"
        cue: "Minor colour with a lifted sixth, a slow arch, and an ending that never resolves."
      wonder:
        name: "Wonder"
        cue: "Lydian colour, rising leaps, a high register and a shimmer of echo."
      hope:
        name: "Hope"
        cue: "A major line that keeps climbing, and lands only at the very end."
      nostalgia:
        name: "Nostalgia"
        cue: "Slow and warm: a gentle arch of notes with a soft echo, like a tune remembered. Sweetness with a trace of loss."
      power:
        name: "Power"
        cue: "Strong, steady and loud, low in register, with a rising line that lands firmly. The cues of strength and triumph."
      tension:
        name: "Tension"
        cue: "Fast, uneven and unresolved: a restless line that keeps pressing and never settles."
      transcendence:
        name: "Transcendence"
        cue: "Very slow and wide: long held tones, a high register, a steady drone and a large echo. A sense of space."
      playfulness:
        name: "Playfulness"
        cue: "Light, quick, detached notes that skip and leap, in a major key. Lightness with a bounce."
    modes:
      major: "major"
      minor: "minor"
      dorian: "dorian"
      lydian: "lydian"
      phrygian: "phrygian"
      locrian: "locrian"
      pentaMaj: "major pentatonic"
