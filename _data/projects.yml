# The project cards on the home and Projects pages, in order. `slug` is the page under
# /projects/ (and /es/projects/, /fa/projects/). Every card needs all three languages.
- slug: camino
  en:
    title: Camino
    blurb: An offline Spanish tutor for beginners, with 25 lessons explained in Persian, English or Spanish. It runs fully offline, so nothing leaves the learner's computer.
  es:
    title: Camino
    blurb: Un tutor de español sin conexión para principiantes, con 25 lecciones explicadas en persa, inglés o español. Funciona sin conexión, y nada sale del ordenador del alumno.
  fa:
    title: Camino
    blurb: معلم آفلاین اسپانیایی برای مبتدی‌ها، با ۲۵ درس که به فارسی، انگلیسی یا اسپانیایی توضیح داده می‌شوند. کاملاً آفلاین کار می‌کند و هیچ چیزی از کامپیوتر زبان‌آموز بیرون نمی‌رود.
- slug: acculturation
  en:
    title: Acculturation
    blurb: A small simulated town that shows when newcomers become part of it and when they stay apart.
  es:
    title: Acculturation
    blurb: Un pueblo pequeño simulado que muestra cuándo los recién llegados pasan a formar parte de él y cuándo se quedan aparte.
  fa:
    title: Acculturation
    blurb: یک شهر کوچکِ شبیه‌سازی‌شده که نشان می‌دهد تازه‌واردها چه زمانی بخشی از آن می‌شوند و چه زمانی جدا می‌مانند.
- slug: tarot-app
  en:
    title: The Digital Tarot Sanctuary
    blurb: AI tarot readings in English, Spanish and Persian, with the 1909 Rider-Waite deck.
  es:
    title: The Digital Tarot Sanctuary
    blurb: Lecturas de tarot con IA en inglés, español y persa, con la baraja Rider-Waite de 1909.
  fa:
    title: The Digital Tarot Sanctuary
    blurb: فال تاروت با هوش مصنوعی به انگلیسی، اسپانیایی و فارسی، با کارت‌های رایدر-ویت ۱۹۰۹.
- slug: music-emotion
  en:
    title: Hear a feeling
    blurb: Type a feeling, or touch a map of feelings, and hear it as a short phrase of music.
  es:
    title: Escucha un sentimiento
    blurb: Escribe un sentimiento, o toca un mapa de sentimientos, y escúchalo como una frase breve de música.
  fa:
    title: یک احساس را بشنوید
    blurb: یک احساس را بنویسید یا نقشهٔ احساس‌ها را لمس کنید و آن را به‌صورت عبارتی کوتاه از موسیقی بشنوید.
